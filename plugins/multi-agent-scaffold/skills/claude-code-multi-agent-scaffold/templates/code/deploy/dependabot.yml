version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/backend/api"
    schedule:
      interval: "weekly"
    groups:
      dotnet-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/src/backend/web"
    schedule:
      interval: "weekly"
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
