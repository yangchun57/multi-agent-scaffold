name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
        working-directory: src/backend/api
      - name: Format 检查
        run: dotnet format --verify-no-changes --no-restore
        working-directory: src/backend/api
        continue-on-error: true
      - name: Build
        run: dotnet build --no-restore
        working-directory: src/backend/api
      - name: Test（单元 + 集成）
        run: dotnet test --no-build --verbosity minimal
        working-directory: src/backend/api

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/backend/web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: src/backend/web
      - name: Format 检查
        run: npm run format:check
        working-directory: src/backend/web
        continue-on-error: true
      - name: Build（含类型检查）
        run: npm run build
        working-directory: src/backend/web
